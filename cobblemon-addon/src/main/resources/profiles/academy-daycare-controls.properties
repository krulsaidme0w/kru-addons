# Explicit opt-in via controller setting academy-daycare-controls (default false).
# Academy 54-slot currently displayed pen only; no pen navigation or commands.
# Provenance: read-only legacy DaycareParentLayout/CobblemonGuiClassifier,
# LiveMeteorDaycareClient and native Cobblemon picker/dialogue contracts.
# Unknown/localized picker/dialogue content is intentionally rejected.
container-slots=54
total-slots=90
pen-codepoint-base=3664
pen-count=6
left-slot=28
right-slot=34
insert-button=0
out-button=1
insert-action=PICKUP
out-action=QUICK_MOVE
backpack-first-slot=51
backpack-last-slot=53
parent-item=cobblemon:pokemon_model
empty-item=minecraft:air
picker-title-regex=daycare
dialogue-context-regex=\\bdaycare\\b
insert-context-regex=\\b(insert|place|put|add|leave|deposit)\\b
out-context-regex=\\b(remove|take|withdraw|retrieve|return)\\b
positive-option-regex=yes|confirm|accept
negative-option-regex=no|cancel|back|keep
