plugins {
    id 'fabric-loom' version '1.7.4'
}

group = 'dev.krul'
version = project.mod_version
base { archivesName = 'kru-cobblemon' }

repositories {
    maven { url = 'https://maven.meteordev.org/releases' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm:9.6'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
processResources {
    inputs.property('version', project.version)
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
test { useJUnitPlatform() }
jar { from('LICENSE'); from('NOTICE') }
tasks.named('sourcesJar') { from('LICENSE'); from('NOTICE') }
